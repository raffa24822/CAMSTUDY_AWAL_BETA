<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ayo Belajar - Kelas 10</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div id="loginSection" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-2 text-cyan-400">Portal Ayo Belajar</h1>
    <p class="text-sm text-slate-400 text-center mb-6">Asesmen Sumatif Tengah Semester - Kelas 10</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Nama / Username</label>
        <input type="text" id="usernameInput" required value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Password / PIN</label>
        <input type="password" id="passwordInput" value="admin123" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>
      <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 font-bold py-3 rounded-lg text-slate-950 transition">
        Masuk Portal
      </button>
    </form>
  </div>

  <div id="appSection" class="hidden w-full max-w-4xl p-6 bg-slate-800 rounded-2xl border border-slate-700">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
      <div>
        <h2 class="text-xl font-bold text-cyan-400">Selamat Datang di Portal!</h2>
        <p class="text-xs text-slate-400" id="userBadge"></p>
      </div>
      <button onclick="logout()" class="bg-red-500/20 text-red-400 border border-red-500/50 px-4 py-2 rounded-lg text-sm">
        Keluar
      </button>
    </div>
    
    <div class="p-4 bg-slate-900/50 rounded-xl border border-slate-700">
      <p class="text-emerald-400 font-medium">✓ Login Berhasil (Bypass Mode Active)</p>
      <p class="text-slate-300 text-sm mt-2">Aplikasi siap digunakan untuk generate soal AI dan bank soal.</p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('usernameInput').value || 'User';
      
      // BYPASS TOTAL: Langsung lolos tanpa validasi password apapun
      localStorage.setItem('currentUser', JSON.stringify({ name: user, role: 'admin' }));
      
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userBadge').innerText = 'Logged in as: ' + user;
    }

    function logout() {
      localStorage.removeItem('currentUser');
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    // Auto login jika session ada
    window.onload = function() {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        const u = JSON.parse(saved);
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userBadge').innerText = 'Logged in as: ' + u.name;
      }
    };
  </script>
</body>
</html>
